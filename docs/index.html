<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fullweight — 지식 그래프</title>
<style>
  :root{
    --bg:#0f1218; --panel:#161b24; --panel2:#1d2430; --line:#2a3342;
    --fg:#e6ebf2; --dim:#8b97a8; --accent:#5aa9e6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #app{display:flex;height:100%}
  aside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column}
  #detail{width:360px;flex:none;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:16px}
  main{flex:1;position:relative;min-width:0}
  canvas{display:block;cursor:grab}
  canvas.drag{cursor:grabbing}

  h1{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);letter-spacing:-.2px}
  h1 small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:3px}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:0;color:var(--dim);padding:9px 0;cursor:pointer;
    font-size:12px;font-family:inherit;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
  .pane{display:none;overflow-y:auto;padding:10px;flex:1}
  .pane.on{display:block}

  .item{padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:3px}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--panel2);outline:1px solid var(--accent)}
  .item .t{font-weight:600;display:flex;align-items:center;gap:7px}
  .item .d{color:var(--dim);font-size:11px;margin-top:3px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .num{color:var(--dim);font-weight:400;font-size:11px;margin-left:auto}

  #search{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:6px;padding:7px 10px;font-family:inherit;font-size:12px}
  .ctl{padding:10px;border-bottom:1px solid var(--line)}
  .ctl label{display:flex;align-items:center;gap:7px;color:var(--dim);margin-top:9px;cursor:pointer;font-size:12px}

  #hits{position:absolute;top:10px;left:10px;background:rgba(22,27,36,.94);border:1px solid var(--line);
    border-radius:6px;max-height:40%;overflow-y:auto;width:300px;display:none;padding:5px}
  #legend{position:absolute;bottom:10px;left:10px;background:rgba(22,27,36,.9);border:1px solid var(--line);
    border-radius:6px;padding:9px 11px;font-size:11px;color:var(--dim);line-height:1.9}
  #legend b{color:var(--fg);font-weight:600}

  .badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:2px 7px;font-size:11px;color:var(--dim);margin:0 4px 4px 0}
  #detail h2{font-size:15px;margin:0 0 4px;word-break:break-all}
  #detail .path{color:var(--dim);font-size:11px;word-break:break-all;margin-bottom:12px}
  #detail .sum{margin:12px 0;line-height:1.75}
  #detail .note{background:var(--panel2);border-left:2px solid var(--accent);padding:9px 11px;
    border-radius:0 5px 5px 0;color:#c6d2e0;font-size:12px;margin:12px 0}
  #detail h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;
    margin:18px 0 7px;font-weight:600}
  .rel{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;gap:7px;align-items:baseline}
  .rel:hover{background:var(--panel2)}
  .rel .k{color:var(--dim);font-size:10px;flex:none;width:64px}
  .empty{color:var(--dim);text-align:center;padding:40px 10px;line-height:1.8}
  .step{counter-increment:s}
  .step .t::before{content:counter(s);background:var(--accent);color:#0f1218;width:18px;height:18px;
    border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
  #tourPane{counter-reset:s}
</style>
</head>

<div id="app">
  <aside>
    <h1>fullweight<small id="sub"></small></h1>
    <div class="ctl">
      <input id="search" placeholder="노드 검색 (파일·함수명)">
      <label><input type="checkbox" id="showFn"> 함수 노드 표시</label>
    </div>
    <div class="tabs">
      <button data-p="layerPane" class="on">레이어</button>
      <button data-p="tourPane">투어</button>
    </div>
    <div id="layerPane" class="pane on"></div>
    <div id="tourPane" class="pane"></div>
  </aside>

  <main>
    <canvas id="cv"></canvas>
    <div id="hits"></div>
    <div id="legend"></div>
  </main>

  <div id="detail"><div class="empty">노드를 클릭하면<br>상세 정보가 표시됩니다.</div></div>
</div>

/* ── 레이어 색상 & 소속 매핑 ── */
const PALETTE = ["#5aa9e6","#f0a35e","#8fd17a","#e0708f","#b89ae0",
                 "#5fd0c4","#e6cf5a","#7d8ff0","#e08a5a","#9aa5b5"];
const layerColor = new Map();
G.layers.forEach((l,i)=>layerColor.set(l.id, PALETTE[i % PALETTE.length]));

const layerOf = new Map();
G.layers.forEach(l => l.nodeIds.forEach(id => layerOf.set(id, l.id)));
// 함수/클래스 노드는 자신이 속한 파일의 레이어를 물려받는다
const layerByPath = new Map();
G.nodes.forEach(n => { if (layerOf.has(n.id) && n.filePath) layerByPath.set(n.filePath, layerOf.get(n.id)); });
G.nodes.forEach(n => { if (!layerOf.has(n.id) && n.filePath && layerByPath.has(n.filePath))
                         layerOf.set(n.id, layerByPath.get(n.filePath)); });

const byId = new Map(G.nodes.map(n => [n.id, n]));
const FILE_TYPES = new Set(["file","config","document","endpoint","service","pipeline","table","schema","resource","module"]);
const isFile = n => FILE_TYPES.has(n.type);

/* 인접 관계 */
const adj = new Map();
G.nodes.forEach(n => adj.set(n.id, []));
G.edges.forEach(e => {
  if (!adj.has(e.source) || !adj.has(e.target)) return;
  adj.get(e.source).push({ id:e.target, type:e.type, dir:"out" });
  adj.get(e.target).push({ id:e.source, type:e.type, dir:"in" });
});

/* ── 레이아웃 (레이어별 앵커 + 스프링 + 반발) ── */
const anchors = new Map();
G.layers.forEach((l,i) => {
  const a = (i / G.layers.length) * Math.PI * 2 - Math.PI/2;
  anchors.set(l.id, { x: Math.cos(a)*430, y: Math.sin(a)*430 });
});

function layout(nodes){
  const idx = new Map(nodes.map((n,i)=>[n.id,i]));
  nodes.forEach((n,i) => {
    const a = anchors.get(layerOf.get(n.id)) || {x:0,y:0};
    n.x = a.x + (Math.random()-.5)*160;
    n.y = a.y + (Math.random()-.5)*160;
  });
  const links = G.edges
    .filter(e => idx.has(e.source) && idx.has(e.target) && e.source !== e.target)
    .map(e => ({ s: idx.get(e.source), t: idx.get(e.target), w: e.weight || .5 }));

  const N = nodes.length, ITER = 420;
  for (let it = 0; it < ITER; it++){
    const cool = 1 - it/ITER;
    for (let i = 0; i < N; i++){
      const a = nodes[i];
      for (let j = i+1; j < N; j++){
        const b = nodes[j];
        let dx = b.x-a.x, dy = b.y-a.y;
        let d2 = dx*dx + dy*dy;
        if (d2 > 40000 || d2 === 0) { if (d2 === 0) { b.x += Math.random(); b.y += Math.random(); } continue; }
        const d = Math.sqrt(d2), f = (1400/d2) * cool;
        const fx = dx/d*f, fy = dy/d*f;
        a.x -= fx; a.y -= fy; b.x += fx; b.y += fy;
      }
    }
    for (const L of links){
      const a = nodes[L.s], b = nodes[L.t];
      const dx = b.x-a.x, dy = b.y-a.y;
      const d = Math.hypot(dx,dy) || .01;
      const f = (d - 58) * 0.016 * L.w * cool;
      const fx = dx/d*f, fy = dy/d*f;
      a.x += fx; a.y += fy; b.x -= fx; b.y -= fy;
    }
    for (const n of nodes){
      const a = anchors.get(layerOf.get(n.id)) || {x:0,y:0};
      n.x += (a.x - n.x) * 0.014 * cool;
      n.y += (a.y - n.y) * 0.014 * cool;
    }
  }
}

/* ── 상태 ── */
let showFn = false;
let view = [];          // 현재 표시 중인 노드
let viewEdges = [];
let selected = null;
let hover = null;
let highlight = null;   // Set<id> — 투어/레이어 강조
let cam = { x:0, y:0, z:1 };

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

function rebuild(){
  view = G.nodes.filter(n => showFn || isFile(n));
  const vis = new Set(view.map(n => n.id));
  viewEdges = G.edges.filter(e => vis.has(e.source) && vis.has(e.target));
  layout(view);
  fit();
  draw();
}

function fit(){
  if (!view.length) return;
  const xs = view.map(n=>n.x), ys = view.map(n=>n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 70;
  const z = Math.min((cv.width - pad*2)/(maxX-minX||1), (cv.height - pad*2)/(maxY-minY||1));
  cam.z = Math.min(z, 1.6);
  cam.x = cv.width/2 - (minX+maxX)/2 * cam.z;
  cam.y = cv.height/2 - (minY+maxY)/2 * cam.z;
}

const radius = n => isFile(n) ? (n.complexity === "complex" ? 8 : n.complexity === "moderate" ? 6.5 : 5.5) : 3.4;
const sx = n => n.x * cam.z + cam.x;
const sy = n => n.y * cam.z + cam.y;

function neighborSet(id){
  const s = new Set([id]);
  (adj.get(id)||[]).forEach(a => s.add(a.id));
  return s;
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#0f1218";
  ctx.fillRect(0,0,cv.width,cv.height);

  const focusId = hover || selected;
  const near = focusId ? neighborSet(focusId) : null;
  const lit = highlight;

  // 엣지
  for (const e of viewEdges){
    const a = byId.get(e.source), b = byId.get(e.target);
    if (a.x === undefined || b.x === undefined) continue;
    let alpha = 0.16;
    if (near) alpha = (near.has(e.source) && near.has(e.target)) ? 0.75 : 0.05;
    else if (lit) alpha = (lit.has(e.source) && lit.has(e.target)) ? 0.7 : 0.05;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = (near && near.has(e.source) && near.has(e.target)) ? "#5aa9e6" : "#55637a";
    ctx.lineWidth = e.type === "contains" ? 0.6 : 1;
    ctx.beginPath(); ctx.moveTo(sx(a),sy(a)); ctx.lineTo(sx(b),sy(b)); ctx.stroke();
  }

  // 노드
  for (const n of view){
    let alpha = 1;
    if (near) alpha = near.has(n.id) ? 1 : 0.18;
    else if (lit) alpha = lit.has(n.id) ? 1 : 0.16;
    ctx.globalAlpha = alpha;
    const r = radius(n) * Math.max(cam.z, .55);
    ctx.fillStyle = layerColor.get(layerOf.get(n.id)) || "#8b97a8";
    ctx.beginPath(); ctx.arc(sx(n), sy(n), r, 0, 7); ctx.fill();
    if (n.id === selected){ ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    else if (lit && lit.has(n.id)){ ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.4; ctx.stroke(); }

    // 라벨: 파일 노드는 확대 시, 강조·선택 노드는 항상
    const labelOn = (isFile(n) && cam.z > 0.72) || n.id === selected || (near && near.has(n.id)) || (lit && lit.has(n.id));
    if (labelOn && alpha > 0.5){
      ctx.globalAlpha = Math.min(alpha, .92);
      ctx.fillStyle = "#e6ebf2";
      ctx.font = (isFile(n) ? "11px " : "10px ") + '-apple-system,"Apple SD Gothic Neo",sans-serif';
      ctx.fillText(n.name, sx(n) + r + 4, sy(n) + 3.5);
    }
  }
  ctx.globalAlpha = 1;
}

/* ── 상호작용 ── */
function pick(mx,my){
  let best = null, bd = 16;
  for (const n of view){
    const d = Math.hypot(sx(n)-mx, sy(n)-my);
    if (d < bd){ bd = d; best = n; }
  }
  return best;
}

let dragging = false, last = null, moved = 0;
cv.addEventListener("mousedown", e => { dragging = true; moved = 0; last = [e.clientX,e.clientY]; cv.classList.add("drag"); });
window.addEventListener("mouseup", () => { dragging = false; cv.classList.remove("drag"); });
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  if (dragging){
    moved += Math.abs(e.clientX-last[0]) + Math.abs(e.clientY-last[1]);
    cam.x += e.clientX-last[0]; cam.y += e.clientY-last[1];
    last = [e.clientX,e.clientY];
    draw(); return;
  }
  const h = pick(mx,my);
  const id = h ? h.id : null;
  if (id !== hover){ hover = id; cv.style.cursor = id ? "pointer" : "grab"; draw(); }
});
cv.addEventListener("click", e => {
  if (moved > 4) return;
  const r = cv.getBoundingClientRect();
  const h = pick(e.clientX-r.left, e.clientY-r.top);
  select(h ? h.id : null);
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const nz = Math.max(0.15, Math.min(5, cam.z * k));
  cam.x = mx - (mx - cam.x) * (nz/cam.z);
  cam.y = my - (my - cam.y) * (nz/cam.z);
  cam.z = nz; draw();
}, { passive:false });

/* ── 상세 패널 ── */
const detail = document.getElementById("detail");
function esc(s){ return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }

function select(id){
  selected = id;
  if (id) highlight = null;
  draw();
  if (!id){ detail.innerHTML = '<div class="empty">노드를 클릭하면<br>상세 정보가 표시됩니다.</div>'; return; }
  const n = byId.get(id);
  const lid = layerOf.get(id);
  const lname = (G.layers.find(l => l.id === lid) || {}).name || "미분류";

  const rels = (adj.get(id) || []).slice().sort((a,b) => a.type.localeCompare(b.type));
  const relHtml = rels.length
    ? rels.map(r => {
        const t = byId.get(r.id); if (!t) return "";
        return `<div class="rel" data-go="${esc(r.id)}">
          <span class="k">${r.dir === "out" ? "→" : "←"} ${esc(r.type)}</span>
          <span>${esc(t.name)}</span></div>`;
      }).join("")
    : '<div style="color:var(--dim)">연결 없음</div>';

  detail.innerHTML = `
    <h2>${esc(n.name)}</h2>
    <div class="path">${esc(n.filePath || "")}${n.lineRange ? ` · ${n.lineRange[0]}–${n.lineRange[1]}행` : ""}</div>
    <div>
      <span class="badge" style="color:${layerColor.get(lid)||"#8b97a8"}">${esc(lname)}</span>
      <span class="badge">${esc(n.type)}</span>
      ${n.complexity ? `<span class="badge">${esc(n.complexity)}</span>` : ""}
    </div>
    <div class="sum">${esc(n.summary || "")}</div>
    ${n.languageNotes ? `<div class="note">${esc(n.languageNotes)}</div>` : ""}
    ${(n.tags||[]).length ? `<h3>태그</h3><div>${n.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join("")}</div>` : ""}
    <h3>연결 (${rels.length})</h3>${relHtml}`;

  detail.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => {
      const tid = el.dataset.go;
      if (!view.some(v => v.id === tid)){ showFn = true; document.getElementById("showFn").checked = true; rebuild(); }
      select(tid); center(tid);
    }));
}

function center(id){
  const n = byId.get(id); if (!n || n.x === undefined) return;
  cam.z = Math.max(cam.z, 1.1);
  cam.x = cv.width/2 - n.x*cam.z;
  cam.y = cv.height/2 - n.y*cam.z;
  draw();
}

/* ── 사이드바 ── */
const layerPane = document.getElementById("layerPane");
layerPane.innerHTML = G.layers.map(l => `
  <div class="item" data-layer="${esc(l.id)}">
    <div class="t"><span class="dot" style="background:${layerColor.get(l.id)}"></span>${esc(l.name)}
      <span class="num">${l.nodeIds.length}</span></div>
    <div class="d">${esc(l.description)}</div>
  </div>`).join("");

layerPane.querySelectorAll("[data-layer]").forEach(el =>
  el.addEventListener("click", () => {
    const on = el.classList.contains("on");
    layerPane.querySelectorAll(".item").forEach(x => x.classList.remove("on"));
    if (on){ highlight = null; }
    else {
      el.classList.add("on");
      const l = G.layers.find(x => x.id === el.dataset.layer);
      highlight = new Set(G.nodes.filter(n => layerOf.get(n.id) === l.id).map(n => n.id));
      selected = null;
      detail.innerHTML = `<h2>${esc(l.name)}</h2><div class="sum">${esc(l.description)}</div>
        <h3>포함 파일 (${l.nodeIds.length})</h3>` +
        l.nodeIds.map(id => { const t = byId.get(id);
          return `<div class="rel" data-go="${esc(id)}"><span>${esc(t ? t.name : id)}</span></div>`; }).join("");
      detail.querySelectorAll("[data-go]").forEach(x =>
        x.addEventListener("click", () => { select(x.dataset.go); center(x.dataset.go); }));
    }
    draw();
  }));

const tourPane = document.getElementById("tourPane");
tourPane.innerHTML = G.tour.map(s => `
  <div class="item step" data-step="${s.order}">
    <div class="t">${esc(s.title)}</div>
    <div class="d">${esc(s.description.slice(0,80))}…</div>
  </div>`).join("");

tourPane.querySelectorAll("[data-step]").forEach(el =>
  el.addEventListener("click", () => {
    tourPane.querySelectorAll(".item").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    const s = G.tour.find(t => String(t.order) === el.dataset.step);
    highlight = new Set(s.nodeIds);
    selected = null;
    detail.innerHTML = `<h2>${s.order}. ${esc(s.title)}</h2>
      <div class="sum">${esc(s.description)}</div>
      ${s.languageLesson ? `<div class="note">${esc(s.languageLesson)}</div>` : ""}
      <h3>살펴볼 파일</h3>` +
      s.nodeIds.map(id => { const t = byId.get(id);
        return `<div class="rel" data-go="${esc(id)}"><span>${esc(t ? t.name : id)}</span>
          <span class="k" style="width:auto;color:var(--dim)">${esc(t ? (t.filePath||"") : "")}</span></div>`; }).join("");
    detail.querySelectorAll("[data-go]").forEach(x =>
      x.addEventListener("click", () => { select(x.dataset.go); center(x.dataset.go); }));
    // 해당 단계 노드들이 보이도록 화면 맞춤
    const pts = s.nodeIds.map(id => byId.get(id)).filter(n => n && n.x !== undefined);
    if (pts.length){
      const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
      cam.z = 0.9;
      cam.x = cv.width/2 - (Math.min(...xs)+Math.max(...xs))/2 * cam.z;
      cam.y = cv.height/2 - (Math.min(...ys)+Math.max(...ys))/2 * cam.z;
    }
    draw();
  }));

document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".pane").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById(b.dataset.p).classList.add("on");
  }));

/* 검색 */
const hits = document.getElementById("hits");
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ hits.style.display = "none"; return; }
  const found = G.nodes.filter(n =>
    n.name.toLowerCase().includes(q) || (n.filePath||"").toLowerCase().includes(q)).slice(0,40);
  hits.style.display = found.length ? "block" : "none";
  hits.innerHTML = found.map(n => `
    <div class="item" data-go="${esc(n.id)}">
      <div class="t" style="font-size:12px">${esc(n.name)}</div>
      <div class="d">${esc(n.filePath||"")}</div></div>`).join("");
  hits.querySelectorAll("[data-go]").forEach(el =>
    el.addEventListener("click", () => {
      const id = el.dataset.go;
      if (!view.some(v => v.id === id)){ showFn = true; document.getElementById("showFn").checked = true; rebuild(); }
      select(id); center(id); hits.style.display = "none";
    }));
});

document.getElementById("showFn").addEventListener("change", e => {
  showFn = e.target.checked; selected = null; highlight = null; rebuild();
});

/* 범례 & 부제 */
const counts = G.nodes.reduce((a,n) => (a[n.type] = (a[n.type]||0)+1, a), {});
document.getElementById("sub").textContent =
  `노드 ${G.nodes.length} · 엣지 ${G.edges.length} · 레이어 ${G.layers.length}`;
document.getElementById("legend").innerHTML =
  `<b>${esc(G.project.description.slice(0,46))}…</b><br>` +
  Object.entries(counts).map(([k,v]) => `${k} ${v}`).join(" · ") +
  `<br>휠=확대 · 드래그=이동 · 클릭=상세`;

function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
  draw();
}
window.addEventListener("resize", () => { resize(); });

resize();
rebuild();
</script>
</body>
</html>
